[sdvx_shader_fix]
log=1
; 1 = also log every D3DXCompileShader call (noisy). fallback/force_fxc lines still log when log=1.
log_verbose=0
enabled=1
; 1 = supply fxc-precompiled bytecode for known Pseudo3d/AFP/Cubism shaders
; when Wine D3DXCompileShader fails (or always, if force_fxc=1).
fallback=1
; 1 = replace Wine-successful compiles with fxc blobs too so VS/PS match.
force_fxc=1
